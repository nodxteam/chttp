<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chttp çalışıyor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 48px 56px;
            max-width: 520px;
            text-align: center;
        }
        .badge {
            display: inline-block;
            background: #00c853;
            color: #000;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 3px 10px;
            border-radius: 999px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }
        h1 { font-size: 2rem; margin-bottom: 12px; }
        p  { color: #888; line-height: 1.6; }
        code {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 2px 7px;
            font-family: 'Cascadia Code', 'Fira Code', monospace;
            font-size: 0.9em;
            color: #c9d1d9;
        }
        .links { margin-top: 28px; display: flex; gap: 12px; justify-content: center; }
        a {
            color: #58a6ff;
            text-decoration: none;
            border: 1px solid #30363d;
            padding: 8px 18px;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: background 0.15s;
        }
        a:hover { background: #21262d; }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">Online</div>
        <h1>chttp/1.0</h1>
        <p>
            C ile yazılmış HTTP sunucusu çalışıyor.<br>
            Dosyaları <code>www/</code> dizinine koyarak sunabilirsin.
        </p>
        <div class="links">
            <a href="/">Ana Sayfa</a>
        </div>
    </div>
</body>
</html>
