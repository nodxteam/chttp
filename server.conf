# ── Core ────────────────────────────────────────────────────────────────────
port        = 8080
root        = ./www
max_threads = 8
log_file    = access.log
users_file  = users.conf

# ── TLS / HTTPS (requires HAVE_OPENSSL) ─────────────────────────────────────
# tls_port = 8443
# tls_cert = cert.pem
# tls_key  = key.pem

# ── Security ─────────────────────────────────────────────────────────────────
rate_limit  = 120    # max requests per minute per IP  (0 = disabled)
timeout_sec = 30     # receive timeout in seconds      (0 = no timeout)

# ── File uploads ─────────────────────────────────────────────────────────────
upload_dir    = ./uploads
upload_max_mb = 16

# ── Virtual hosts ─────────────────────────────────────────────────────────────
# vhost.mysite.com  = ./vhosts/mysite
# vhost.api.mysite.com = ./vhosts/api

# ── Reverse proxy rules ───────────────────────────────────────────────────────
# proxy./api     = http://127.0.0.1:3000
# proxy./backend = http://127.0.0.1:4000
